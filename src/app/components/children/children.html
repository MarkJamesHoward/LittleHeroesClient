<template>
  <require from="./children.css"></require>
  <require from="../app/shake.css"></require>

  <div class="au-animate ChildrenFadeIn ChildrenFadeOut">
    <Audio src="../../sounds/bell.mp3"></Audio>

    <div show.bind="errorHadOccurred">
      <div class="center" style="height: 100vh; width: 100vw">
        <h2>Oops something went wrong! ${errorMessage}</h2>
        <paper-button click.trigger="CloseError()">Close</paper-button>
      </div>
    </div>

    <div class="OfflineDialog" show.bind="offline">
      <div class="center">
        <h2>Seems you are offline</h2>
        <paper-button click.trigger="CheckOnlineOrNot()">Attempt to reconnect</paper-button>
      </div>
    </div>

    <div class="orangeBackground">
      <div class="AllChildrenAureliaAnimators SnapContainer">
        <div
          style="overflow:hidden"
          class="SwitchChild SnapChild"
          repeat.for="child of browniePoints"
        >
          <div>
            <!--Error occurred-->
            <div show.bind="errorHadOccurred">
              <div class="center">
                <h2 style="user-select: none;">
                  Oops something went wrong! ${errorMessage}
                </h2>
                <paper-button click.trigger="CloseError()">Close</paper-button>
              </div>
            </div>

            <!--Levelled up - moved to its own page!-->

            <div draggable="false;" class="MasterContainer">
              <div
                style="user-select: none;display:grid; height: 100%;width: 100%;
              grid-area: main;position:relative; "
                class="${(!showBonusTimeIntro && (showBonusBall || showBonusSquare) ) ? 'BonusOverlayActive' : ''}"
              >
                <div class="BonusPointsTime" if.bind="showBonusTimeIntro">
                  <div>Bonus Time in</div>
                  <div>${BonusCountdown}</div>
                </div>

                <div
                  click.trigger="AddBonusPointBall(child, 1)"
                  if.bind="showBonusBall"
                  class="${showBonusBall == true ? 'ball' : ''}"
                >
                  <span style="font-family: Gochi Hand; font-size: 3rem;">1</span>
                </div>

                <div
                  style="font-family: Gochi Hand; font-size: 3rem;"
                  click.trigger="AddBonusPointSquare(child, 2)"
                  if.bind="showBonusSquare"
                  class="${showBonusSquare == true ? 'square' : ''}"
                >
                  <span style="font-family: Gochi Hand; font-size: 3rem;">2</span>
                </div>

                <div
                  style="font-family: Gochi Hand; font-size: 3rem;"
                  click.trigger="AddBonusPointBall2(child, 1)"
                  if.bind="showBonusBall2"
                  class="${showBonusBall2 == true ? 'ball2' : ''}"
                >
                  <span style="font-family: Gochi Hand; font-size: 3rem;">1</span>
                </div>
              </div>

              <div
                class="MonsterContainer"
                style="user-select: none;display:grid; height: 100%;grid-area: main; z-index: 0;"
              >
                <monster-creator
                  user-select:none;
                  style="display:block; flex-grow: 1;user-select: none"
                  customize="No"
                  selectedmouthindex.two-way="child.pet.mouth"
                  selectedeyeindex.two-way="child.pet.eyes"
                  selectedlegsindex.two-way="child.pet.legs"
                  selectedsilhouetteindex.two-way="child.pet.silhouette"
                  selectedmouthy.two-way="child.pet.selectedmouthy"
                  selectedmouthx.two-way="child.pet.selectedmouthx"
                  selectedeyey.two-way="child.pet.selectedeyey"
                  selectedeyex.two-way="child.pet.selectedeyex"
                  selectedlegsy.two-way="child.pet.selectedlegsy"
                  selectedlegsx.two-way="child.pet.selectedlegsx"
                  level.two-way="child.level"
                >

                  <img class="EyeSlot" slot="EyesSlot1" src="../../../../images/eyes/eyes1.png" />
                  <img class="EyeSlot" slot="EyesSlot2" src="../../../../images/eyes/eyes2.png" />
                  <img class="EyeSlot" slot="EyesSlot3" src="../../../../images/eyes/eyes3.png" />
                  <img class="EyeSlot" slot="EyesSlot4" src="../../../../images/eyes/eyes4.png" />

                  <img slot="MouthSlot1" src="../../../../images/mouths/mouth1.png" />
                  <img slot="MouthSlot2" src="../../../../images/mouths/mouth2.png" />
                  <img slot="MouthSlot3" src="../../../../images/mouths/mouth3.png" />
                  <img slot="MouthSlot4" src="../../../../images/mouths/mouth4.png" />

                  <img slot="LegsSlot1" src="../../../../images/legs/Legs1.png" />
                  <img slot="LegsSlot2" src="../../../../images/legs/Legs2.png" />
                  <img slot="LegsSlot3" src="../../../../images/legs/Legs4.png" />
                  <img slot="LegsSlot4" src="../../../../images/legs/Legs3.png" />
                </monster-creator>
              </div>

              <div
                class="myContainer"
                style="grid-area:main; z-index:1"
                if.bind="!levelledUp && !errorHadOccurred"
              >
                <!--Name and Points-->
                <div>
                  <div style="display:flex;justify-content:space-between;flex-direction:row;">
                    <!-- Circle with Level (dashed)-->
                    <div id="Level" class="LevelAnimation" style="opacity:0">
                      <div
                        style="display:flex;justify-content:center;
                                              background-color:red;
                                              color: white;
                                              font-size: 1.7rem;
                                              margin: 1rem;
                                             align-items:center;
                                             flex-direction: column;
                                             height:20vmin;border-radius: 50%;
                                             width:20vmin;
                                             border: 3px dashed black;"
                      >
                        <div style="user-select: none">Level</div>
                        <div style="user-select: none">${child.level}</div>
                      </div>
                    </div>
                    <!-- End Circle with Level (dashed)-->

                    <div
                      style="display:flex; flex-direction: column;margin: 1rem;align-items:flex-end"
                    >
                      <div
                        if.bind="!editingChildName"
                        click.trigger="EditMode()"
                        class="ChildNameAnimation"
                      >
                        <span style="user-select: none;" class="nameTitle">${child.childName}</span>
                      </div>
                      <div if.bind="editingChildName">
                        <div
                          class="nameTitle"
                          style="display:flex;justify-content:center;align-items:center"
                        >
                          <input
                            type="text"
                            maxlength="20"
                            name="childName"
                            class="inline-edit"
                            style="max-width: 60vw;background: white;color: black"
                            value.bind="child.childName"
                            keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                          />
                        </div>
                      </div>
                      <div class="points">
                        <div class="${shakePoints == true ? 'shakeItem' : 'nothing'}">
                          <span style="user-select: none"
                            >${child.points}
                            <span style="font-size: 1rem">pts</span>
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- FLIP CARD -->
                <div
                  class="flipContainer"
                  if.bind="!child.removeForAnimation"
                  class="avatar avatarAnimation au-animate"
                  style="grid-area:Avatar"
                >
                  <div id="card" class="${showingAvailableRewards == true ? 'rotate' : ''}">
                    <div class="front" style="display:flex;justify-content:space-around">
                      <!-- Monster was here.... -->
                    </div>

                    <div class="back" style="padding:0.2rem">
                      <div
                        class="au-stagger rewardsAnimations"
                        style="height: 95%;padding-left:1rem;padding-right: 1rem;max-height: 30vh;overflow-y:scroll"
                      >
                        <h2 style="text-align: center;margin-bottom:2rem; user-select:none">
                          Rewards available
                        </h2>

                        <div
                          class="au-animate rewardsAnimations"
                          repeat.for="availableReward of child.availableRewards"
                        >
                          <div
                            class="RewardItem"
                            style="overflow: hidden;font-size:1.5rem;display:flex;justify-content:space-around;margin-top:0.6rem;"
                          >
                            <div class="availableRewardName">
                              <span style="user-select: none">${availableReward.reward}</span>
                            </div>
                            <paper-button
                              raised
                              style="font-size:1.5rem; user-select:none"
                              click.trigger="Use(availableReward, child)"
                            >
                              Use
                            </paper-button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!--Rewards-->
                <div
                  if.bind="!child.removeForAnimation"
                  class="avatarAnimation au-animate"
                  style="grid-area:Rewards"
                >
                  <div class="RewardsRow">
                    <div style="user-select: none;">Next Reward at 100 pts is:</div>

                    <div if.bind="!editingReward">
                      <div style="display:flex;justify-content:center;align-items:center">
                        <div click.trigger="EditMode()">
                          <span style="user-select:none">${child.reward}</span>
                        </div>
                      </div>
                    </div>
                    <div if.bind="editingReward">
                      <div style="display:flex;justify-content:center;align-items:center">
                        <input
                          type="text"
                          maxlength="20"
                          class="inline-edit"
                          style="max-width:60vw;background: white;color: black"
                          name="reward"
                          value.bind="child.reward"
                          keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                        />
                      </div>
                    </div>
                  </div>
                </div>

                <!--Buttons-->
                <div
                  draggable="false"
                  if.bind="!child.removeForAnimation"
                  class="ControlPanelAnimation au-animate"
                  style="grid-area:Buttons;align-self:end;justify-self:center"
                >
                  <div
                    draggable="false"
                    style="user-select:none;display:flex;flex-direction: column; align-items:center;"
                  >
                    <div style="user-select:none" draggable="false" class="ControlPanelWrapper">
                      <div style="user-select:none" draggable="false" class="ControlPanel">
                        <div
                          draggable="false"
                          style="user-select:none;display:flex;flex-direction:row;flex-wrap: wrap;"
                        >
                          <img
                            draggable="false"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="Home()"
                            src="../../../../images/home.png"
                            alt=""
                          />
                          <img
                            draggable="false"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="incrementCounterExtra(child)"
                            src="../../../../images/10.png"
                            alt=""
                          />
                          <img
                            draggable="false"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="incrementCounter(child)"
                            src="../../../../images/1.png"
                            alt=""
                          />
                          <img
                            draggable="false"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="DeductCounter(child)"
                            src="../../../../images/negative.png"
                            alt=""
                          />
                          <img
                            draggable="false"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="ViewPet(child)"
                            src="../../../../images/pet.png"
                            alt=""
                          />
                          <img
                            alt="Achievements"
                            draggable="false"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="ViewAchievements(child)"
                            src="../../../../images/trophy.png"
                            alt=""
                          />
                          <img
                            draggable="false"
                            if.bind="child.availableRewards.length > 0"
                            class="EmojiButtons"
                            style="width:3rem; height:3rem"
                            click.trigger="ViewAvailableRewards()"
                            src="../../../../images/rewards.png"
                            alt=""
                          />
                        </div>
                      </div>
                    </div>
                    <div class="ControlPanelBase"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
