<template>
  <require from="./children.css"></require>
  <require from="./levelup.css"></require>

  <style>
    svg {
      width: 100%;
      height: 100%;
    }
    .circle-container > img {
      width: 15vmin;
    }

    .SnapContainer {
      scroll-snap-type: x mandatory;
      width: 100vw;
      overflow-x: scroll;
      display: flex;
    }

    .SnapChild {
      min-width: 100vw;
      scroll-snap-align: start;
    }

    .ControlPanel {
      border: 0.5rem solid red;
      border-radius: 3rem;
      padding: 1rem;
      background-color: peachpuff;
    }

    .ControlPanelWrapper {
      border: 0.5rem solid black;
      border-radius: 3rem;
      background-color: red;
    }

    .ControlPanelAnimation {
    }

    .ControlPanelBase {
      border-left: 1rem solid black;
      border-right: 1rem solid black;
      height: 2rem;
      width: 50%;
    }

    .OverlayTwoItems {
      display: grid;
      grid-template-areas: "main";
      grid-template-rows: 1fr;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: center;
      /*border: 5px solid yellow;*/
      width: 80%;
    }

    .MakeMeGrey {
      filter: grayscale(100%);
      opacity: 0.1;
      transition: opacity 5s, filter 0.5s;
    }

    .circle-container {
      grid-area: main;
    }

    .ActualAvatarImage {
      grid-area: main;
      /*width: 20vmin;*/
    }

    #Level {
      grid-area: main;
      /*z-index: 3;*/
      align-self: start;
      justify-self: start;
    }

    #Pet {
      grid-area: main;
      align-self: start;
      justify-self: start;
    }

    @keyframes MySlideIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes MySlideOut {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .AvailableRewardsButton {
      font-size: 1.5rem;
      margin-top: 0.2rem;
      display: block;
      margin: 2px;
    }

    .flipContainer {
      perspective: 1200px;
      height: 100%;
      /*border: 10px solid blue;*/
    }

    .rotate {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      height: 100%;
      width: 100%;
      backface-visibility: hidden;
      grid-area: card;
    }

    .front {
      background-color: orange;
    }

    .back {
      background-color: darkorange;
      transform: rotateY(180deg);
      border-radius: 1rem;
    }

    #card {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "card";
      transition: all 1s ease-in-out;
      transform-style: preserve-3d;
      height: 100%;
    }

    .AvailableRewardsRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1rem;
      max-height: 100px;
      margin-bottom: 0.2rem;
    }

    .waiting {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-size: 2.5rem;
    }

    .errorMessage {
      position: absolute;
      bottom: 20px;
      right: 100px;
      height: 20px;
      color: red;
    }

    /*.myContainer {
            box-sizing: border-box;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin: 0;
            padding: 0;
        }*/

    .myContainer {
      box-sizing: border-box;
      height: 97vh;
      width: 100vw;
      display: grid;
      grid-template-rows: 1fr 8fr 1fr 1fr;
      grid-template-columns: 1fr;
      grid-template-areas:
        "Name"
        "Avatar"
        "Rewards"
        "Buttons";
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    .nameTitle {
      /*max-width: 68vw;*/
      text-align: center;
      font-size: 3rem;
      margin-bottom: 0;
      margin-top: 0;
      font-family: "Permanent Marker";
    }

    .DojoButton {
      /*min-width: 25rem;*/
      font-size: 1.5rem;
      margin-top: 0.2rem;
      display: block;
      margin: 2px;
    }

    .level {
      color: orange;
      font-size: 1rem;
    }

    .points {
      color: black;
      font-size: 5rem;
      text-align: center;
      /*background-color:darkorange;*/
      font-family: "Shrikhand";
    }

    .levelUp {
      display: block;
    }

    .RewardsRow {
      text-align: center;
      font-size: 2rem;
    }

    .childSelection button {
      margin: 10px;
    }
  </style>

  <div show.bind="errorHadOccurred">
    <div class="center">
      <h2>Oops something went wrong! ${errorMessage}</h2>
      <paper-button click.trigger="CloseError()">Close</paper-button>
    </div>
  </div>

  <div class="OfflineDialog" show.bind="offline">
    <div class="center">
      <h2>Seems you are offline</h2>
      <h3>Sorry we failed to add those points</h3>
      <paper-button click.trigger="CheckOnlineOrNot()"
        >Attempt to reconnect</paper-button
      >
    </div>
  </div>

  <div class="orangeBackground">
    <div class="AllChildrenAureliaAnimators SnapContainer">
      <div
        style="overflow:hidden"
        class="SwitchChild SnapChild"
        repeat.for="child of browniePoints"
      >
        <div>
          <!--Error occurred-->
          <div show.bind="errorHadOccurred">
            <div class="center">
              <h2>Oops something went wrong! ${errorMessage}</h2>
              <paper-button click.trigger="CloseError()">Close</paper-button>
            </div>
          </div>

          <!--Levelled up-->
          <div
            show.bind="levelledUp"
            class="pyro"
            style="overflow: hidden;position:relative"
          >
            <div class="before"></div>
            <div class="after"></div>
            <div class="SpreadOutVertical">
              <div>
                <i style="margin-top:1rem" class="fa fa-gift fa-3x"></i>

                <div style="text-align:center">
                  <h4>
                    <Strong
                      >${child.reward == 'Enter reward here!' ? '' :
                      child.reward}</Strong
                    >
                  </h4>
                </div>
              </div>

              <div class="LeveUpContainer">
                <div class="LinesTop">
                  <div class="toplineleft"></div>
                  <h5>Congratulations ${child.childName}</h5>
                  <div class="toplineright"></div>
                </div>
                <h3 class="TransformedLevelUp">YOU LEVELED UP</h3>
                <div class="LinesTop">
                  <div class="bottomlineleft"></div>
                  <h5>You are now on Level ${child.level}</h5>
                  <div class="bottomlineright"></div>
                </div>
              </div>

              <paper-button
                style="margin-top:5rem"
                class="btn btn-primary btn-lg "
                click.trigger="CloseLevelUp()"
                >Continue</paper-button
              >
            </div>
          </div>

          <div class="myContainer" if.bind="!levelledUp && !errorHadOccurred">
            <!--Name and Points-->
            <div>
              <div
                style="display:flex;justify-content:space-between;flex-direction:row;"
              >
                <!-- Circle with Level (dashed)-->
                <div id="Level">
                  <div
                    style="display:flex;justify-content:center;
                                         align-items:center;
                                         flex-direction: column;
                                         height:15vmin;border-radius: 50%;
                                         width:15vmin;
                                         border: 3px dashed black;"
                  >
                    <div>Level</div>
                    <div>${child.level}</div>
                  </div>
                </div>
                <!-- End Circle with Level (dashed)-->

                <div style="display:flex; flex-direction: column">
                  <div if.bind="!editingChildName" click.trigger="EditMode()">
                    <span class="nameTitle">${child.childName}</span>
                  </div>
                  <div class="points">
                    <div style="grid-area:main">
                      <span></span> ${child.points}
                    </div>
                  </div>
                </div>

                <div if.bind="editingChildName">
                  <div
                    style="display:flex;justify-content:center;align-items:center"
                  >
                    <input
                      type="text"
                      maxlength="20"
                      name="childName"
                      class="inline-edit"
                      style="max-width: 60vw"
                      value.bind="child.childName"
                      keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                    />
                  </div>
                </div>
              </div>
            </div>

            <!--AVATAR-->
            <div
              if.bind="!child.removeForAnimation"
              class="avatar avatarAnimation au-animate"
              style="grid-area:Avatar"
            >
              <!-- FLIP CARD -->
              <div class="flipContainer">
                <div
                  id="card"
                  class="${showingAvailableRewards == true ? 'rotate' : ''}"
                >
                  <div
                    class="front"
                    style="display:flex;justify-content:space-around"
                  >
                    <!-- Pet -->
                    <div
                      id="Pet"
                      style="height:100%"
                      class.bind="editingAvatar ? 'MakeMeGrey' : '' "
                    >
                      <monster-creator
                        style="display:block;cursor: pointer; height: 100%"

                        selectedmouthindex.two-way="child.pet.mouth"
                        selectedeyeindex.two-way="child.pet.eyes"
                        selectedsilhouetteindex.two-way="child.pet.silhouette"
                        selectedmouthy.two-way="child.pet.selectedmouthy"
                        selectedmouthx.two-way="child.pet.selectedmouthx"
                        selectedeyey.two-way="child.pet.selectedeyey"
                        selectedeyex.two-way="child.pet.selectedeyex"
                        number-of-images-mouth="3"
                        number-of-images-eyes="3"
                        click.trigger="ViewPet(child)"
                        level.two-way="child.level"

                          />
                        </svg>

                        <img
                          class="EyeSlot"
                          slot="EyesSlot1"
                          src="../../../../images/eyes/eyes1.png"
                        />
                        <img
                          class="EyeSlot"
                          slot="EyesSlot2"
                          src="../../../../images/eyes/eyes2.png"
                        />
                        <img
                          class="EyeSlot"
                          slot="EyesSlot3"
                          src="../../../../images/eyes/eyes3.png"
                        />

                        <img
                          slot="MouthSlot1"
                          src="../../../../images/mouths/mouth1.png"
                        />
                        <img
                          slot="MouthSlot2"
                          src="../../../../images/mouths/mouth2.png"
                        />
                        <img

                    <!-- End Pet-->
                  </div>

                  <div class="back" style="padding:0.2rem">
                    <div
                      class="au-stagger rewardsAnimations"
                      style="height: 95%;padding-left:1rem;padding-right: 1rem;max-height: 30vh;overflow-y:scroll"
                    >
                      <h2 style="text-align: center;margin-bottom:2rem">
                        Rewards available
                      </h2>

                      <div
                        class="au-animate rewardsAnimations"
                        repeat.for="availableReward of child.availableRewards"
                      >
                        <div
                          style="overflow: hidden;font-size:1.5rem;display:flex;justify-content:space-around;margin-top:0.6rem;"
                        >
                          <div class="availableRewardName">
                            ${availableReward.reward}
                          </div>
                          <paper-button
                            style="font-size:1.5rem"
                            click.trigger="Use(availableReward, child)"
                          >
                            Use
                          </paper-button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!--Rewards-->
            <div
              if.bind="!child.removeForAnimation"
              class="avatarAnimation au-animate"
              style="grid-area:Rewards"
            >
              <div class="RewardsRow">
                <h5>Next Reward</h5>

                <div if.bind="!editingReward">
                  <div
                    style="display:flex;justify-content:center;align-items:center"
                  >
                    <div click.trigger="EditMode()">${child.reward}</div>
                  </div>
                </div>
                <div if.bind="editingReward">
                  <div
                    style="display:flex;justify-content:center;align-items:center"
                  >
                    <input
                      type="text"
                      maxlength="20"
                      class="inline-edit"
                      style="max-width:60vw;"
                      name="reward"
                      value.bind="child.reward"
                      keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                    />
                  </div>
                </div>
              </div>
            </div>

            <!--Buttons-->
            <div
              if.bind="!child.removeForAnimation"
              class="ControlPanelAnimation au-animate"
              style="grid-area:Buttons;align-self:end;justify-self:center"
            >
              <div
                style="display:flex;flex-direction: column; align-items:center;"
              >
                <div class="ControlPanelWrapper">
                  <div class="ControlPanel">
                    <div
                      style="display:flex;flex-direction:row;flex-wrap: wrap;"
                    >
                      <paper-icon-button
                        slot="top"
                        icon="home"
                        click.trigger="Home()"
                        style="justify-self:flex-start"
                        class="DojoButton"
                      >
                      </paper-icon-button>

                      <paper-icon-button
                        raised
                        slot="top"
                        icon="thumb-up"
                        class="DojoButton"
                        click.trigger="incrementCounterExtra(child)"
                      >
                      </paper-icon-button>

                      <paper-icon-button
                        class="DojoButton"
                        icon="add"
                        click.trigger="incrementCounter(child)"
                      >
                      </paper-icon-button>

                      <paper-icon-button
                        raised
                        icon="shopping-cart"
                        if.bind="showingAvailableRewards"
                        class="AvailableRewardsButton btn btn-success"
                        click.trigger="ViewPoints()"
                      >
                      </paper-icon-button>

                      <paper-icon-button
                        click.trigger="ViewAvailableRewards()"
                        title="Rewards"
                        icon="shopping-cart"
                        if.bind="!showingAvailableRewards && child.availableRewards.length > 0"
                      >
                      </paper-icon-button>

                      <paper-icon-button
                        icon="thumb-down"
                        class="DojoButton"
                        click.trigger="DeductCounter(child)"
                      >
                      </paper-icon-button>

                      <paper-icon-button
                        icon="autorenew"
                        class="DojoButton"
                        click.trigger="CheckOnlineOrNot()"
                      >
                      </paper-icon-button>
                    </div>
                  </div>
                </div>
                <div class="ControlPanelBase"></div>
              </div>
            </div>

      </div>

  </div>
</template>
