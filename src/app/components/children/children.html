    .RewardItem {
      background: brown;
      border-radius: 1rem;
      font-family: "Fredoka One", cursive;
    }

    .BonusOverlayActive{
      background-color: orange;
      opacity: 0.9;
      z-index: 1000;
    }

    .BonusPointsTime{
      background-color:orange;
      border: 0.3rem solid blue;
      width: 100vw;
      height: 20vh;
      font-size: 4rem;
      display:flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index:100;
      grid-area: main;
      opacity: 0.8;
      font-family: "Fredoka One", cursive;
    }

    .ball, .ball2 {
      width: 5rem;
      height: 5rem;
      position: absolute;
      top: 45vh;
      left: 45vw;
      border-radius: 50%;
      background-color:chartreuse;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: AnimateBall 4s 1;
      animation-delay: 5s;
      opacity: 0;
      cursor: pointer;
      z-index: 1000;
      user-select: none;
      border: 0.2rem solid black;
    }

    .ball2 {
      animation: AnimateBall2 4s 1;
      animation-delay: 5s;
    }

    .square {
      cursor: pointer;
      width: 4rem;
      user-select:none;
      height: 4rem;
      position: absolute;
      top: 55vh;
      left: 55vw;
      background-color:cadetblue;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: AnimateSquare 4s 1;
      animation-delay: 5s;
      opacity: 0;
      z-index: 1000;
      border: 0.2rem solid black;
    }

    @keyframes AnimateBall2 {
      5% {
        opacity: 0.8;
        transform: rotate(359deg) scale(1.5);
      }
      29% {
        opacity: 1;
      }
      30% {
        transform:  translateX(40vw) scale(1) rotate(5deg);
        }
        70% {
          transform: translateY(40vh) scale(1) rotate(-5deg);
        }
        90%{
          opacity: 1;
          transform: scale(1) rotate(10deg);
        }
        100% {
          opacity: 0.2;
          transform: scale(0.2) rotate(359deg);
        }
    }
    @keyframes AnimateBall {
      5% {
        opacity: 0.8;
        transform: rotate(359deg) scale(1.5);
      }
      29% {
        opacity: 1;
      }
      30% {
        transform:  translateX(-40vw) scale(1) rotate(5deg);
        }
        70% {
          transform: translateY(-40vh) scale(1) rotate(-5deg);
        }
        90%{
          opacity: 1;
          transform: scale(1) rotate(10deg);
        }
        100% {
          opacity: 0.2;
          transform: scale(0.2) rotate(359deg);
        }
    }

    @keyframes AnimateSquare {
      5% {
        opacity: 0.8;
        transform: rotate(359deg) scale(1.5);
      }
      30% {
        opacity: 1;
        transform:  translateY(35vh) scale(1) rotate(180deg);
        }
        70% {
          transform: translateX(40vw) scale(1) rotate(-50deg); 
        }
        90%{
          transform: scale(1) rotate(50deg);
        }
        100% {
          opacity: 1;
          transform: rotate(350deg) scale(0.2) ;
        }
    }

    }

    }

                         <span style="user-select: none">${child.points}
                           <span style="font-size: 1rem">pts</span>
                          </span>
                      </div>
                    </div>
                  </div>

                  <div if.bind="editingChildName">
                    <div
                      style="display:flex;justify-content:center;align-items:center"
                    >
                      <input
                        type="text"
                        maxlength="20"
                        name="childName"
                        class="inline-edit"
                        style="max-width: 60vw"
                        value.bind="child.childName"
                        keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <!-- FLIP CARD -->
              <div
                class="flipContainer"
                if.bind="!child.removeForAnimation"
                class="avatar avatarAnimation au-animate"
                style="grid-area:Avatar"
              >
                <div
                  id="card"
                  class="${showingAvailableRewards == true ? 'rotate' : ''}"
                >
                  <div
                    class="front"
                    style="display:flex;justify-content:space-around"
                  >
                    <!-- Monster was here.... -->
                  </div>

                  <div class="back" style="padding:0.2rem">
                    <div
                      class="au-stagger rewardsAnimations"
                      style="height: 95%;padding-left:1rem;padding-right: 1rem;max-height: 30vh;overflow-y:scroll"
                    >
                      <h2 style="text-align: center;margin-bottom:2rem; user-select:none">
                        Rewards available
                      </h2>

                      <div
                        class="au-animate rewardsAnimations"
                        repeat.for="availableReward of child.availableRewards"
                      >
                        <div
                        class="RewardItem"
                          style="overflow: hidden;font-size:1.5rem;display:flex;justify-content:space-around;margin-top:0.6rem;"
                        >
                          <div class="availableRewardName" >
                            <span style="user-select: none">${availableReward.reward}</span>
                          </div>
                          <paper-button
                          raised
                            style="font-size:1.5rem; user-select:none"
                            click.trigger="Use(availableReward, child)"
                          >
                            Use
                          </paper-button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!--Rewards-->
              <div
                if.bind="!child.removeForAnimation"
                class="avatarAnimation au-animate"
                style="grid-area:Rewards"
              >
                <div class="RewardsRow">
                  <h5 style="user-select: none">Next Reward at 100 pts is:</h5>

                  <div if.bind="!editingReward">
                    <div
                      style="display:flex;justify-content:center;align-items:center"
                    >
                      <div click.trigger="EditMode()"> <span style="user-select:none">${child.reward}</span></div>
                    </div>
                  </div>
                  <div if.bind="editingReward">
                    <div
                      style="display:flex;justify-content:center;align-items:center"
                    >
                      <input
                        type="text"
                        maxlength="20"
                        class="inline-edit"
                        style="max-width:60vw;"
                        name="reward"
                        value.bind="child.reward"
                        keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <!--Buttons-->
              <div draggable="false"
                if.bind="!child.removeForAnimation"
                class="ControlPanelAnimation au-animate"
                style="grid-area:Buttons;align-self:end;justify-self:center"
              >
                <div draggable="false"
                  style="user-select:none;display:flex;flex-direction: column; align-items:center;"
                >
                  <div style="user-select:none" draggable="false" class="ControlPanelWrapper">
                    <div style="user-select:none" draggable="false" class="ControlPanel">
                      <div draggable="false"
                        style="user-select:none;display:flex;flex-direction:row;flex-wrap: wrap;"
                      >
                       
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="Home()" src="../../../../images/home.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="incrementCounterExtra(child)" src="../../../../images/10.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="incrementCounter(child)" src="../../../../images/1.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="DeductCounter(child)" src="../../../../images/negative.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem"  click.trigger="ViewPet(child)" src="../../../../images/pet.png" alt="">
                        <img alt="Achievements" draggable="false" class="EmojiButtons" style="width:3rem; height:3rem"  click.trigger="ViewAchievements(child)" src="../../../../images/trophy.png" alt="">
                        <img draggable="false" if.bind="child.availableRewards.length > 0" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="ViewAvailableRewards()" src="../../../../images/rewards.png" alt="">
                      
                      </div>
                    </div>
                  </div>
                  <div class="ControlPanelBase"></div>
                </div>
              </div>
            </div>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
