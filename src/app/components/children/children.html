<template>
  <require from="./children.css"></require>
  <require from="./levelup.css"></require>
  <require from="../app/shake.css"></require>
  <require from="../app/levelrotate.css"></require>
  
  <style>

    .RewardItem {
      background: brown;
      border-radius: 1rem;
      font-family: "Fredoka One", cursive;
    }

    .BonusOverlayActive{
      background-color: orange;
      opacity: 0.9;
      z-index: 1000;
    }

    .BonusPointsTime{
      background-color:orange;
      border: 0.3rem solid blue;
      width: 100vw;
      height: 20vh;
      font-size: 4rem;
      display:flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index:100;
      grid-area: main;
      opacity: 0.8;
      font-family: "Fredoka One", cursive;
    }

    .ball, .ball2 {
      width: 5rem;
      height: 5rem;
      position: absolute;
      top: 45vh;
      left: 45vw;
      border-radius: 50%;
      background-color:chartreuse;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: AnimateBall 4s 1;
      animation-delay: 5s;
      opacity: 0;
      cursor: pointer;
      z-index: 1000;
      user-select: none;
      border: 0.2rem solid black;
    }

    .ball2 {
      animation: AnimateBall2 4s 1;
      animation-delay: 5s;
    }

    .square {
      cursor: pointer;
      width: 4rem;
      user-select:none;
      height: 4rem;
      position: absolute;
      top: 55vh;
      left: 55vw;
      background-color:cadetblue;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: AnimateSquare 4s 1;
      animation-delay: 5s;
      opacity: 0;
      z-index: 1000;
      border: 0.2rem solid black;
    }

    @keyframes AnimateBall2 {
      5% {
        opacity: 0.8;
        transform: rotate(359deg) scale(1.5);
      }
      29% {
        opacity: 1;
      }
      30% {
        transform:  translateX(40vw) scale(1) rotate(5deg);
        }
        70% {
          transform: translateY(40vh) scale(1) rotate(-5deg);
        }
        90%{
          opacity: 1;
          transform: scale(1) rotate(10deg);
        }
        100% {
          opacity: 0.2;
          transform: scale(0.2) rotate(359deg);
        }
    }
    @keyframes AnimateBall {
      5% {
        opacity: 0.8;
        transform: rotate(359deg) scale(1.5);
      }
      29% {
        opacity: 1;
      }
      30% {
        transform:  translateX(-40vw) scale(1) rotate(5deg);
        }
        70% {
          transform: translateY(-40vh) scale(1) rotate(-5deg);
        }
        90%{
          opacity: 1;
          transform: scale(1) rotate(10deg);
        }
        100% {
          opacity: 0.2;
          transform: scale(0.2) rotate(359deg);
        }
    }

    @keyframes AnimateSquare {
      5% {
        opacity: 0.8;
        transform: rotate(359deg) scale(1.5);
      }
      30% {
        opacity: 1;
        transform:  translateY(35vh) scale(1) rotate(180deg);
        }
        70% {
          transform: translateX(40vw) scale(1) rotate(-50deg); 
        }
        90%{
          transform: scale(1) rotate(50deg);
        }
        100% {
          opacity: 1;
          transform: rotate(350deg) scale(0.2) ;
        }
    }

    .MasterContainer {
      display: grid;
      grid-template-areas: "main";
      height: 97vh;
      justify-content: center;
      align-items: center;
    }

    .circle-container > img {
      width: 15vmin;
    }

    .SnapContainer {
      scroll-snap-type: x mandatory;
      width: 100vw;
      overflow-x: scroll;
      display: flex;
    }

    .SnapChild {
      min-width: 100vw;
      scroll-snap-align: start;
    }

    .ControlPanel {
      border: 0.5rem solid red;
      border-radius: 3rem;
      padding: 1rem;
      background-color: peachpuff;
    }

    .ControlPanelWrapper {
      border: 0.5rem solid black;
      border-radius: 3rem;
      background-color: red;
      margin-bottom: 1rem;
    }

    .ControlPanelAnimation {
    }

    .ControlPanelBase {
      --border-left: 1rem solid black;
      --border-right: 1rem solid black;
      --height: 2rem;
      --width: 50%;
    }

    .OverlayTwoItems {
      display: grid;
      grid-template-areas: "main";
      grid-template-rows: 1fr;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: center;
      /*border: 5px solid yellow;*/
      width: 80%;
    }

    .EmojiButtons {
      margin-left: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .EmojiButtons:hover {
      transform: scale(1.1);
      transition: 0.1s all;
    }

    .MakeMeGrey {
      filter: grayscale(100%);
      opacity: 0.1;
      transition: opacity 5s, filter 0.5s;
    }

    .circle-container {
      grid-area: main;
    }

    .ActualAvatarImage {
      grid-area: main;
      /*width: 20vmin;*/
    }

    #Level {
      grid-area: main;
      /*z-index: 3;*/
      align-self: start;
      justify-self: start;
      font-family: "Fredoka One", cursive;
    }

    #Pet {
      grid-area: main;
      align-self: start;
      justify-self: start;
    }

    @keyframes MySlideIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes MySlideOut {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .AvailableRewardsButton {
      font-size: 1.5rem;
      margin-top: 0.2rem;
      display: block;
      margin: 2px;
    }

    .flipContainer {
      perspective: 1200px;
      height: 100%;
      /*border: 10px solid blue;*/
    }

    .rotate {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      height: 100%;
      width: 100%;
      backface-visibility: hidden;
      grid-area: card;
    }

    .front {
      --background-color: orange;
    }

    .back {
      background-color: darkorange;
      transform: rotateY(180deg);
      border-radius: 1rem;
    }

    #card {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "card";
      transition: all 1s ease-in-out;
      transform-style: preserve-3d;
      height: 100%;
    }

    .AvailableRewardsRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1rem;
      max-height: 100px;
      margin-bottom: 0.2rem;
    }

    .waiting {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-size: 2.5rem;
    }

    .errorMessage {
      position: absolute;
      bottom: 20px;
      right: 100px;
      height: 20px;
      color: red;
    }

    .myContainer {
      box-sizing: border-box;
      height: 97vh;
      width: 100vw;
      display: grid;
      grid-template-rows: 1fr 8fr 1fr 1fr;
      grid-template-columns: 1fr;
      grid-template-areas:
        "Name"
        "Avatar"
        "Rewards"
        "Buttons";
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    .nameTitle {
      /*max-width: 68vw;*/
      text-align: center;
      font-size: 6rem;
      margin-bottom: 0;
      margin-top: 0;
      font-family: "Gochi Hand", cursive;
    }

    .DojoButton {
      /*min-width: 25rem;*/
      font-size: 1.5rem;
      margin-top: 0.2rem;
      display: block;
      margin: 2px;
    }

    .level {
      color: orange;
      font-size: 1rem;
    }

    .points {
      color: black;
      font-size: 5rem;
      text-align: center;
      /*background-color:darkorange;*/
      font-family: "Fredoka One", cursive;
    }

    .levelUp {
      display: block;
    }

    .RewardsRow {
      text-align: center;
      font-size: 2rem;
      font-family: "Fredoka One", cursive;
    }

    .childSelection button {
      margin: 10px;
    }
  </style>

      <h2>Oops something went wrong! ${errorMessage}</h2>
      <paper-button click.trigger="CloseError()">Close</paper-button>
    </div>
  </div>

  <div class="OfflineDialog" show.bind="offline">
    <div class="center">
      <h2>Seems you are offline</h2>
      <paper-button click.trigger="CheckOnlineOrNot()"
        >Attempt to reconnect</paper-button
      >
    </div>
  </div>

            </div>

            <div
              class="myContainer"
              style="grid-area:main; z-index:1"
              if.bind="!levelledUp && !errorHadOccurred"
            >
              <!--Name and Points-->
              <div>
                <div
                  style="display:flex;justify-content:space-between;flex-direction:row;"
                >
                  <!-- Circle with Level (dashed)-->
                  <div id="Level">
                    <div
                      style="display:flex;justify-content:center;
                                            background-color:red;
                                            color: white;
                                            font-size: 1.7rem;
                                            margin: 1rem;
                                           align-items:center;
                                           flex-direction: column;
                                           height:20vmin;border-radius: 50%;
                                           width:20vmin;
                                           border: 3px dashed black;"
                    >
                      <div style="user-select: none">Level</div>
                      <div style="user-select: none">${child.level}</div>
                    </div>
                  </div>
                  <!-- End Circle with Level (dashed)-->

                  <div
                    style="display:flex; flex-direction: column;margin: 1rem;align-items:flex-end"
                  >
                    <div if.bind="!editingChildName" click.trigger="EditMode()">
                      <span style="user-select: none;" class="nameTitle">${child.childName}</span>
                    </div>
                    <div class="points">
                      <div  class="${shakePoints == true ? 'shakeItem' : 'nothing'}">
                         <span style="user-select: none">${child.points}
                           <span style="font-size: 1rem">pts</span>
                          </span>
                      </div>
                    </div>
                  </div>

                  <div if.bind="editingChildName">
                    <div
                      style="display:flex;justify-content:center;align-items:center"
                    >
                      <input
                        type="text"
                        maxlength="20"
                        name="childName"
                        class="inline-edit"
                        style="max-width: 60vw"
                        value.bind="child.childName"
                        keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <!-- FLIP CARD -->
              <div
                class="flipContainer"
                if.bind="!child.removeForAnimation"
                class="avatar avatarAnimation au-animate"
                style="grid-area:Avatar"
              >
                <div
                  id="card"
                  class="${showingAvailableRewards == true ? 'rotate' : ''}"
                >
                  <div
                    class="front"
                    style="display:flex;justify-content:space-around"
                  >
                    <!-- Monster was here.... -->
                  </div>

                  <div class="back" style="padding:0.2rem">
                    <div
                      class="au-stagger rewardsAnimations"
                      style="height: 95%;padding-left:1rem;padding-right: 1rem;max-height: 30vh;overflow-y:scroll"
                    >
                      <h2 style="text-align: center;margin-bottom:2rem; user-select:none">
                        Rewards available
                      </h2>

                      <div
                        class="au-animate rewardsAnimations"
                        repeat.for="availableReward of child.availableRewards"
                      >
                        <div
                        class="RewardItem"
                          style="overflow: hidden;font-size:1.5rem;display:flex;justify-content:space-around;margin-top:0.6rem;"
                        >
                          <div class="availableRewardName" >
                            <span style="user-select: none">${availableReward.reward}</span>
                          </div>
                          <paper-button
                          raised
                            style="font-size:1.5rem; user-select:none"
                            click.trigger="Use(availableReward, child)"
                          >
                            Use
                          </paper-button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!--Rewards-->
              <div
                if.bind="!child.removeForAnimation"
                class="avatarAnimation au-animate"
                style="grid-area:Rewards"
              >
                <div class="RewardsRow">
                  <h5 style="user-select: none">Next Reward at 100 pts is:</h5>

                  <div if.bind="!editingReward">
                    <div
                      style="display:flex;justify-content:center;align-items:center"
                    >
                      <div click.trigger="EditMode()"> <span style="user-select:none">${child.reward}</span></div>
                    </div>
                  </div>
                  <div if.bind="editingReward">
                    <div
                      style="display:flex;justify-content:center;align-items:center"
                    >
                      <input
                        type="text"
                        maxlength="20"
                        class="inline-edit"
                        style="max-width:60vw;"
                        name="reward"
                        value.bind="child.reward"
                        keypress.delegate="IfEnterKeySaveChanges($event, child, child.childName, child.reward)"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <!--Buttons-->
              <div draggable="false"
                if.bind="!child.removeForAnimation"
                class="ControlPanelAnimation au-animate"
                style="grid-area:Buttons;align-self:end;justify-self:center"
              >
                <div draggable="false"
                  style="user-select:none;display:flex;flex-direction: column; align-items:center;"
                >
                  <div style="user-select:none" draggable="false" class="ControlPanelWrapper">
                    <div style="user-select:none" draggable="false" class="ControlPanel">
                      <div draggable="false"
                        style="user-select:none;display:flex;flex-direction:row;flex-wrap: wrap;"
                      >
                       
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="Home()" src="../../../../images/home.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="incrementCounterExtra(child)" src="../../../../images/10.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="incrementCounter(child)" src="../../../../images/1.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="DeductCounter(child)" src="../../../../images/negative.png" alt="">
                        <img draggable="false" class="EmojiButtons" style="width:3rem; height:3rem"  click.trigger="ViewPet(child)" src="../../../../images/pet.png" alt="">
                        <img alt="Achievements" draggable="false" class="EmojiButtons" style="width:3rem; height:3rem"  click.trigger="ViewAchievements(child)" src="../../../../images/trophy.png" alt="">
                        <img draggable="false" if.bind="child.availableRewards.length > 0" class="EmojiButtons" style="width:3rem; height:3rem" click.trigger="ViewAvailableRewards()" src="../../../../images/rewards.png" alt="">
                      
                      </div>
                    </div>
                  </div>
                  <div class="ControlPanelBase"></div>
                </div>
              </div>
            </div>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
