<style>
    .Myflex {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-around;
    }

    .KidsFlex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        width: 40vw;
    }

    .horizontalFlex {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin: 0.5rem;
    }

    button {
        margin: 0.3rem
    }

    .title {
        text-align: center;
        margin-bottom: 3rem;
        margin-top: 5rem;
    }

    .MyContainer {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 90vh
    }

    .InviteParentTextBox {
        margin-top: 5rem
    }
</style>

<!--Error occurred-->
<div show.bind="displayError">
    <div class="center">
        <h2>
            ${errorMessage}
        </h2>
        <button class="btn btn-primary btn-lg " click.trigger="CloseError()">Close</button>
    </div>
</div>


<div if.bind="inviteNewParentActive" class="InviteParentTextBox Myflex">
    <p>
        To invite another parent please enter their email address in the below
    </p>
    <input class="inline-edit" type="email" value.bind="newUserInviteEmailAddress" name="newParent" id="newParent" />
    <div class="horizontalFlex">
        <button click.trigger="SendInvite()" class="btn btn-primary">Invite</button>
        <button click.trigger="Cancel()" class="btn btn-danger">Cancel</button>
    </div>
    <div show.bind="InviteSentSuccessfully">
        Invite sent successfully <span class="glyphicon glyphicon-send"></span>
    </div>

    <div show.bind="InviteFailed">
        Invite sent successfully <span class="glyphicon glyphicon-send"></span>
    </div>
</div>

<div class="Myflex">

    <div show.bind="!inviteNewParentActive">
        <h3 class="title">Parents</h3>

        <div show.bind="!loading">
            <div class="KidsFlex" repeat.for="member of groupMembers">
                <div class="horizontalFlex">
                    <div style="margin-right: 0.5rem">
                        ${member.email}
                    </div>
                    <div class="btn btn-danger glyphicon glyphicon-remove" click.trigger="RemoveGroupMember(member)"></div>
                </div>
            </div>
        </div>

        <button click.trigger="InitiateNewParent()" class="btn btn-primary">Invite new parent</button>

    </div>

</div>

<div show.bind="loading">
    Loading...
    <span class="glyphicon glyphicon-refresh wait"></span>
</div>
