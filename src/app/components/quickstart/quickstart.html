  <style>
    .NameAndDeleteButton {
      display: flex;
      width: 50vw;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3rem;
    }

    .Myflex {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    input {
      font-size: 3rem;
    }

    .btn {
      font-size: 2rem;
      margin-top: 1rem;
      background: var(--button-color);
    }

    .DeleteBtn {
      font-size: 1.5rem;
    }

    .KidsFlex {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 3rem;
      margin-top: 5rem;
    }

    h3 {
      text-align: center;
    }

    .title {
      text-align: center;
      margin-bottom: 3rem;

      font-size: 4rem;
      font-family: "Fredoka One", cursive;
    }

    .WhiteText {
      color: white;
    }
  </style>

  <!--Error occurred-->
  <div show.bind="displayError">
    <div class="center">
      <h2>Sorry! something went wrong..</h2>
      <h2>${errorMessage}</h2>
      <button class="btn btn-primary btn-lg" click.trigger="Home()">
        Close
      </button>
    </div>
  </div>

  <div show.bind="!displayError">
    <div show.bind="connecting">
      <div style="display: flex; flex-direction: column;place-items:center">
        <h2 class="title">Creating your account... hold tight, nearly done</h2>
        <button class="btn" show.bind="DelayInCreationOfAccount" style="width: 40vw;font-size: 2rem" click.trigger="Login()">
            <div class="spinner"></div>
            <span>Cancel</span>
        </button>
      </div>
    </div>

    <div class="Myflex orangeBackground WhiteText" show.bind="!connecting">
      <h1 class="title">You're all set</h1>
      <h3>We've created two child accounts to get you started</h3>
      <button
        class="btn"
        id="LetsGo"
        style="background-color: var(--button-color)"
        click.trigger="Start()"
        >Let's Go!</button>
