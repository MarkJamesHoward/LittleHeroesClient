<template>
    <require from="../../library/Spinner/spinner.css"></require>

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      background: black;
      color: white;
    }

    label{
      font-family: "Gochi Hand", cursive;
      font-size: 3rem;
    }

    .hidden {
      display: none;
    }

    .loginFailed {
      color: red;
    }

    paper-checkbox {
      color: white;
    }

   .horizontalcenter {
      display:flex;
      flex-direction:column;
      align-items: center;
    }

    h3 {
      margin-top: 5vh;
      margin-bottom: 5vh;
    }

    paper-button {
      margin-top: 1rem;
      background :var(--button-color);
    }

    .inputgroup {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    input {
      font-size: 2rem;
      flex-grow: 1;
      min-height: 20px;
      margin-left: 1rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }
    .data {
      display: grid;
      grid-template-rows: 3fr 2fr 1fr;
      grid-template-areas: "signin"
                            "register"
                            "back";
      height: 95vh;
      justify-content: space-around;
      align-items: center;
    }
  </style>




    <div class="data">
      <div style="grid-area: signin">
        <div class="horizontalcenter">
          <h3>Already signed up?</h3>
          <div class="inputgroup" style="grid-area: username">
            <label for="username">Username</label>
            <input
              id="papertest"
              label="Username"
              name="username"
              type="text"
              value.bind="myusername"
            >
            </input>
          </div>
          <div class="inputgroup" style="grid-area: password">
            <label for="Password">Password</label>
            <input
            name="Password"
              label="Password"
              type="Password"
              value.bind="mypassword"
            >
            </input>
          </div>
          <div>
            <paper-button style="min-width: 150px;font-size: 2rem" click.trigger="Login()" raised>
              <div class="${attemptingLogin ? 'spinner' : 'hidden'}"></div>
              <span show.bind="attemptingLogin">Attempting Login...</span>
              <span show.bind="!loginFailed && !attemptingLogin">Login</span>
              <span show.bind="loginFailed" class="${loginFailed == true ? 'loginFailed' : '' }">
                Login failed
              </span>
            </paper-button>            
          </div>
          <paper-checkbox style="margin-top: 1rem;" value.bind="rememberMe">Remember me</paper-checkbox>

        </div>
      </div>

      <div style="grid-area: register">
        <div class="horizontalcenter">
          <h3 id="RegisterTitle">First time here?</h3>
          <paper-button id="RegisterButton" raised click.trigger="Register()"
            >Register</paper-button
          >
        </div>
      </div>

      <div style="grid-area: back">
        <div class="horizontalcenter">
          <h3>Take me Home!</h3>
          <paper-button raised click.trigger="Home()"
            >Home</paper-button
          >
        </div>
      </div>
    </div>

 
</template>
