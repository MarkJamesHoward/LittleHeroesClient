<template>

    <style>

        .NameAndDeleteButton {
            display: flex;
            width: 50vw; 
            justify-content:space-between;
            margin-bottom: 0.3rem;
        } 
        
        .Myflex {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items:center;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .KidsFlex {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 3rem;
            margin-top: 5rem;
        }

        .title {
            text-align: center;
            margin-bottom: 3rem;
            margin-top: 5rem;
        }
    </style>

    <!--Error occurred-->
    <div show.bind="displayError">
        <div class="center">
            <h2>
                ${errorMessage}
            </h2>
            <button class="btn btn-primary btn-lg " click.delegate="CloseError()">Close</button>
        </div>
    </div>

    <div class="KidsFlex" show.bind="addingChildActivated">
        <div style="display:flex;align-items:center;justify-content:center">
            <label for="childName">Name</label>
            <input class="inline" style="max-width: 40vw;margin-left:1rem" maxlength="20" type="text" name="childName" value.bind="newChildName" />
        </div>
        <div>
            <button class="btn btn-primary" click.delegate="AddChild()">Add</button>
            <button class="btn btn-danger" click.delegate="Cancel()">Cancel</button>
        </div>
    </div>

    <div class="Myflex orangeBackground">

        <div show.bind="!addingChildActivated">
            <h1 class="title">Heroes</h1>

            <div repeat.for="child of registeredKids">
                <div class="NameAndDeleteButton">
                    <div class="largeText"> ${child.childName} </div>
                    <div class="btn btn-danger fa fa-user-times"s click.delegate="RemoveChild(child)"></div>
                </div>
            </div>

            <button class="btn btn-success fa fa-user-plus" click.delegate="ActivateAddChild()">
            </button>

            <div show.bind="loading">
                <span>Attempting add..</span>
                <span class="glyphicon glyphicon-refresh wait">

                </span>
            </div>

        </div>

    </div>

</template>
