<style>
  @keyframes fadeOut {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  .kidsAnimations.au-stagger {
    animation-delay: 500ms;
  }

  .kidsAnimations.au-enter {
    opacity: 0;
  }

  .kidsAnimations.au-enter-active {
    animation: fadeIn 0.5s;
  }

  .kidsAnimations.au-leave-active {
    animation: fadeOut 0.5s;
  }

  .kidsAnimations.au-stagger {
    animation-delay: 500ms;
  }

  .OverlayErrors {
    display: grid;
    grid-template-areas: "main";
    height: 100vh;
  }

  .NameAndDeleteButton {
    display: flex;
    width: 100vw;
    justify-content: space-around;
    align-items: center;
    margin-bottom: 2rem;
  }

  .Myflex {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100vh;
  }

  label {
    color: var(--text-color);
  }

  input {
    font-size: 3rem;
  }

  .squareButton button,
  .AddChildFlex button {
    border-radius: 0;
    height: 15vh;
  }

  .DeleteBtn {
    font-size: 1.5rem;
  }

  * {
    box-sizing: border-box;
  }

  .AddChildFlex {
    padding-top: 3rem;
    display: flex;
    flex-direction: column;
    font-size: 3rem;
    height: 100vh;
    justify-content: space-between;
  }

  .title {
    text-align: center;
    margin-bottom: 3rem;
    margin-top: 5rem;
  }

  .border {
    margin-bottom: 1rem;
    border-bottom: 0.2rem solid mediumblue;
  }
</style>

<!--Error occurred-->
<div show.bind="displayError">
  <div class="center">
    <h2 style="text-align: center">${errorMessage}</h2>
    <button class="btn btn-primary btn-lg " click.trigger="CloseError()">
      Close
    </button>
  </div>
</div>

<div class="AddChildFlex" show.bind="addingChildActivated">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center">
    <h1 style="text-align: justify;font-size:5rem;">New Hero</h1>
    <input
      id="InputBox"
      class="input inline"
      style="max-width: 80vw;margin-left:1rem;margin-top: 2rem;font-size:3rem;"
      maxlength="20"
      type="text"
      placeholder="New Hero"
      name="childName"
      value.bind="newChildName"
    />
  </div>
  <div style="display: flex;">
    <button class="btn" style="flex: 1" click.trigger="AddChild()"> Add </button>
    <button class="btn" style="flex: 1" click.trigger="Cancel()"> Cancel </button>
  </div>
</div>

<div class="Myflex orangeBackground" show.bind="!addingChildActivated && !displayError">
  <h1 class="title" style="font-size: 4rem;margin-top:0">Manage Heroes</h1>

  <div>
    <div class="au-animate kidsAnimations border" repeat.for="child of registeredKids">
      <div class="NameAndDeleteButton">
        <div class="largeText">${child.childName}</div>
        <button class="btn DeleteBtn" click.trigger="RemoveChild(child)">
          delete
        </button>
      </div>
    </div>
  </div>

  <div class="squareButton" style="display:grid;grid-template-columns: 1fr 1fr">
    <button class="btn" click.trigger="ActivateAddChild()">Add Hero</button>
    <button class="btn" click.trigger="Home()">Return Home</button>
  </div>

  <div show.bind="loading">
    <span>Attempting add..</span>
  </div>

  <div show.bind="deleting">
    <span>Performing delete..</span>
  </div>
</div>
