<template>
  <style>
    .NameAndDeleteButton {
      display: flex;
      width: 50vw;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3rem;
    }

    .Myflex {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    input {
      font-size: 3rem;
    }

    paper-button {
      font-size: 2rem;
      margin-top: 1rem;
    }

    .DeleteBtn {
      font-size: 1.5rem;
    }

    .KidsFlex {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 3rem;
      margin-top: 5rem;
    }

    .title {
      text-align: center;
      margin-bottom: 3rem;
      margin-top: 5rem;
    }
  </style>

  <!--Error occurred-->
  <div show.bind="displayError">
    <div class="center">
      <h2>${errorMessage}</h2>
      <paper-button
        class="btn btn-primary btn-lg "
        click.trigger="CloseError()"
      >
        Close
      </paper-button>
    </div>
  </div>

  <div class="KidsFlex" show.bind="addingChildActivated">
    <div style="display:flex;align-items:center;justify-content:center">
      <label for="childName">Name</label>
      <input
        class="inline"
        style="max-width: 40vw;margin-left:1rem"
        maxlength="20"
        type="text"
        name="childName"
        value.bind="newChildName"
      />
    </div>
    <div>
      <paper-button raised click.trigger="AddChild()"> Add </paper-button>
      <paper-button raised click.trigger="Cancel()"> Cancel </paper-button>
    </div>
  </div>

  <div class="Myflex orangeBackground" show.bind="!addingChildActivated">
    <h1 class="title">Manage Heroes</h1>

    <div repeat.for="child of registeredKids">
      <div class="NameAndDeleteButton">
        <div class="largeText">${child.childName}</div>
        <paper-button
          class="DeleteBtn"
          raised
          click.trigger="RemoveChild(child)"
        >
          delete
        </paper-button>
      </div>
    </div>

    <div style="display: flex">
      <paper-button raised click.trigger="ActivateAddChild()"
        >Add New</paper-button
      >

      <paper-button raised click.trigger="Home()">Return Home</paper-button>
    </div>

    <div show.bind="loading">
      <span>Attempting add..</span>
      <span class="glyphicon glyphicon-refresh wait"> </span>
    </div>
  </div>
</template>
