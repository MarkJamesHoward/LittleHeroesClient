<template>
  <style>
    @keyframes fadeOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .kidsAnimations.au-stagger {
      animation-delay: 500ms;
    }

    .kidsAnimations.au-enter {
      opacity: 0;
    }

    .kidsAnimations.au-enter-active {
      animation: fadeIn 0.5s;
    }

    .kidsAnimations.au-leave-active {
      animation: fadeOut 0.5s;
    }

    .kidsAnimations.au-stagger {
      animation-delay: 500ms;
    }

    .OverlayErrors {
      display: grid;
      grid-template-areas: "main";
      height: 100vh;
    }

    .NameAndDeleteButton {
      display: flex;
      width: 100vw;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 2rem;
    }

    .Myflex {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
    }

    label {
      color: var(--text-color);
    }

    input {
      font-size: 3rem;
    }

    paper-button {
      font-size: 1.5rem;
      margin: 0;
    }

    .squareButton paper-button,
    .AddChildFlex paper-button {
      border-radius: 0;
      height: 15vh;
    }

    .DeleteBtn {
      font-size: 1.5rem;
    }

    * {
      box-sizing: border-box;
    }

    .AddChildFlex {
      padding-top: 3rem;
      display: flex;
      flex-direction: column;
      font-size: 3rem;
      height: 100vh;
      justify-content: space-between;
    }

    .title {
      text-align: center;
      margin-bottom: 3rem;
      margin-top: 5rem;
    }

    .border {
      margin-bottom: 1rem;
      border-bottom: 0.2rem solid mediumblue;
    }
  </style>

  <!--Error occurred-->
  <div show.bind="displayError">
    <div class="center">
      <h2 style="text-align: center">${errorMessage}</h2>
      <paper-button class="btn btn-primary btn-lg " click.trigger="CloseError()">
        Close
      </paper-button>
    </div>
  </div>

  <div class="AddChildFlex" show.bind="addingChildActivated">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <h1 style="text-align: justify;font-size:5rem;">New Hero</h1>
      <paper-input
      id="InputBox"
        class="inline"
        style="max-width: 80vw;margin-left:1rem;margin-top: 2rem;"
        maxlength="20"
        type="text"
        label="New Hero"
        name="childName"
        value.bind="newChildName"
      ></paper-input>
    </div>
    <div style="display: flex;">
      <paper-button style="flex: 1" raised click.trigger="AddChild()"> Add </paper-button>
      <paper-button style="flex: 1" raised click.trigger="Cancel()"> Cancel </paper-button>
    </div>
  </div>

  <div class="Myflex orangeBackground" show.bind="!addingChildActivated && !displayError">
    <h1 class="title" style="font-size: 4rem;margin-top:0">Manage Heroes</h1>

    <div>
      <div class="au-animate kidsAnimations border" repeat.for="child of registeredKids">
        <div class="NameAndDeleteButton">
          <div class="largeText">${child.childName}</div>
          <paper-button class="DeleteBtn" raised click.trigger="RemoveChild(child)">
            delete
          </paper-button>
        </div>
      </div>
    </div>

    <div class="squareButton" style="display:grid;grid-template-columns: 1fr 1fr">
      <paper-button raised click.trigger="ActivateAddChild()">Add Hero</paper-button>
      <paper-button raised click.trigger="Home()">Return Home</paper-button>
    </div>

    <div show.bind="loading">
      <span>Attempting add..</span>
    </div>

    <div show.bind="deleting">
      <span>Performing delete..</span>
    </div>
  </div>
</template>
